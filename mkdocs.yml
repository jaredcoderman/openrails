site_name: Track builder
site_description: GeoJSON railroad lines to Open Rails TDB
site_url: https://jaredcoderman.github.io/openrails/

theme:
  name: material
  features:
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - attr_list
  - tables

docs_dir: track_builder_docs
site_dir: site

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md

# Old URLs kept as short redirects so bookmarks still resolve under /openrails/.
# They are not listed in nav.
