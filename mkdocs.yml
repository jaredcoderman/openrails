site_name: Track builder
site_description: GeoJSON railroad lines to Open Rails TDB
theme:
  name: material
  features:
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - attr_list
  - tables

docs_dir: track_builder_docs
site_dir: site

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md
